<div class="card">
  <mat-form-field appearance="outline" class="search-box">
    <input matInput placeholder="Search by title..." (keyup)="applyFilter($event)" />
  </mat-form-field>

  <table mat-table [dataSource]="pagedBooks">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let book">{{ book.title }}</td>
    </ng-container>

    <ng-container matColumnDef="releaseDate">
      <th mat-header-cell *matHeaderCellDef>Release date</th>
      <td mat-cell *matCellDef="let book">{{ book.releaseDate }}</td>
    </ng-container>

    <ng-container matColumnDef="pages">
      <th mat-header-cell *matHeaderCellDef>Pages</th>
      <td mat-cell *matCellDef="let book">{{ book.pages }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let book">
        {{ book.description }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="pagination-footer">
    <span>Страниц {{ totalPages }}</span>

    <div class="pagination-controls">
      <span>
        строк на страницу {{ pageIndex * pageSize + 1 }}-{{
          pageIndex * pageSize + pagedBooks.length
        }}
        из {{ filteredBooks.length }}
      </span>
      <button (click)="prevPage()" [disabled]="pageIndex === 0">‹</button>
      <button (click)="nextPage()" [disabled]="pageIndex >= totalPages - 1">›</button>
    </div>
  </div>
</div>
